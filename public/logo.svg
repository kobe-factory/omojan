<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <defs>
    <filter id="brush" x="-4%" y="-20%" width="108%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="brush2" x="-4%" y="-20%" width="108%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" seed="7" result="noise2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise2" scale="1.2" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
  </defs>

  <!-- 筆跡風の背景帯 -->
  <path d="M4,34 C18,20 60,40 110,28 C155,18 210,38 260,24 C275,19 288,26 296,22"
        stroke="#6EE7B7" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.38"/>
  <!-- 小さい筆跡アクセント -->
  <path d="M8,44 C30,40 70,46 120,42"
        stroke="#34D399" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.25"/>
  <path d="M180,44 C220,40 260,46 292,40"
        stroke="#34D399" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2"/>

  <!-- メインテキスト: おもじゃん online -->
  <text x="150" y="40"
        text-anchor="middle"
        font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', '游明朝', 'MS Mincho', 'MS 明朝', Georgia, serif"
        font-size="34"
        font-weight="bold"
        fill="#064E3B"
        filter="url(#brush)"
        letter-spacing="1">おもじゃん online</text>
</svg>
